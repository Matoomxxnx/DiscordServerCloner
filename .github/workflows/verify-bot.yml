name: Discord Verify Bot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: discord-verify-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secrets
        run: |
          if [ -z "$VERIFY_BOT_TOKEN" ]; then
            echo "::error::Missing GitHub secret VERIFY_BOT_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          VERIFY_BOT_TOKEN: ${{ secrets.VERIFY_BOT_TOKEN }}

      - name: Run bot
        run: python -u verify_bot.py
        env:
          PYTHONUNBUFFERED: "1"
          VERIFY_BOT_TOKEN: ${{ secrets.VERIFY_BOT_TOKEN }}
          VERIFY_CONFIG: ${{ secrets.VERIFY_CONFIG }}
