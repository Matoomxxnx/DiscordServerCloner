name: Discord Verify Bot

on:
  schedule:
    - cron: "0 */6 * * *"   # รีสตาร์ทอัตโนมัติทุก 6 ชั่วโมง
  workflow_dispatch:          # กดรันมือได้จาก GitHub

concurrency:
  group: discord-verify-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip discord.py==2.6.2

      - name: Run bot
        run: python -u verify_bot.py
        env:
          PYTHONUNBUFFERED: "1"
          VERIFY_BOT_TOKEN: ${{ secrets.VERIFY_BOT_TOKEN }}
          VERIFY_CONFIG: ${{ secrets.VERIFY_CONFIG }}
