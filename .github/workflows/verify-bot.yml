name: Discord Verify Bot

on:
  push:
    branches: ["main"]     # push โค้ดใหม่แล้วให้ GitHub Actions รีสตาร์ทบอททันที
  schedule:
    - cron: "0 */5 * * *"   # รีสตาร์ทอัตโนมัติทุก 5 ชั่วโมง เพื่อให้บอทออนไลน์ต่อเนื่องบน GitHub Actions
  workflow_dispatch:          # กดรันมือได้จาก GitHub

concurrency:
  group: discord-verify-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip "discord.py[voice]==2.7.1" davey==0.1.5

      - name: Check required secrets
        run: |
          if [ -z "$VERIFY_BOT_TOKEN" ]; then
            echo "::error::Missing GitHub secret VERIFY_BOT_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          VERIFY_BOT_TOKEN: ${{ secrets.VERIFY_BOT_TOKEN }}

      - name: Run bot
        run: python -u verify_bot.py
        env:
          PYTHONUNBUFFERED: "1"
          VERIFY_BOT_TOKEN: ${{ secrets.VERIFY_BOT_TOKEN }}
          VERIFY_CONFIG: ${{ secrets.VERIFY_CONFIG }}
